# Konfiguracja Pages CMS (https://app.pagescms.org).
# Określa, co można edytować w panelu i jakimi polami.

media:
  input: obrazy
  output: /obrazy
  categories: [image, document]

content:
  - name: sekcje
    label: Sekcje (kafelki i treści)
    description: Kafelki na stronie głównej. Każdy kafelek bez „adresu” ma własną podstronę z treścią.
    type: file
    path: tresci/sekcje.json
    format: json
    fields:
      - name: sekcje
        label: Sekcje
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{tytul}"
        fields:
          - name: tytul
            label: Tytuł
            type: string
            required: true
          - name: tresc
            label: Wprowadzenie
            description: Tekst nad zakładkami podsekcji (opcjonalny).
            type: rich-text
          - name: podsekcje
            label: Podsekcje (zakładki)
            description: "Każda podsekcja to osobna zakładka na podstronie, np. „Przyczyny”, „Jak przeciwdziałać”. Podsekcja bez treści jest ukryta. Kolejność = kolejność zakładek."
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{tytul}"
            fields:
              - name: tytul
                label: Tytuł zakładki
                type: string
                required: true
              - name: tresc
                label: Treść
                type: rich-text
          - name: opis
            label: Opis na kafelku
            type: text
          - name: przycisk
            label: Tekst przycisku na kafelku
            description: Puste = „Przejdź”.
            type: string
          - name: id
            label: Adres podstrony
            description: "Krótka nazwa w adresie strony, np. „oddech” → sekcja.html?s=oddech. Małe litery, bez polskich znaków i spacji. Nie zmieniaj, jeśli link był już komuś wysłany."
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9-]+$"
              message: Tylko małe litery bez polskich znaków, cyfry i myślniki.
          - name: ikona
            label: Ikona
            type: select
            options:
              values:
                - value: badanie
                  label: Kartka z listą (badanie)
                - value: wypalenie
                  label: Płomień (wypalenie)
                - value: energia
                  label: Bateria (energia)
                - value: odpornosc
                  label: Góry (odporność)
                - value: kalkulator
                  label: Kalkulator (koszty)
                - value: filmy
                  label: Ekran z przyciskiem odtwarzania (filmy)
                - value: ksiazki
                  label: Otwarta książka (książki)
          - name: wyroznij
            label: Wyróżniony kafelek (kolorowy)
            type: boolean
          - name: ukryj
            label: Ukryj na stronie
            type: boolean
          - name: adres
            label: Link zewnętrzny zamiast podstrony
            description: "Wypełnij tylko, jeśli kafelek ma prowadzić gdzie indziej (np. „badanie/”). Wtedy treść podstrony jest ignorowana."
            type: string

  - name: strona
    label: Strona główna i kontakt
    type: file
    path: tresci/strona.json
    format: json
    fields:
      - name: naglowek
        label: Nagłówek strony głównej
        type: string
      - name: wstep
        label: Wstęp pod nagłówkiem
        type: text
      - name: tytul_strony
        label: Tytuł w karcie przeglądarki
        type: string
      - name: komunikat_w_przygotowaniu
        label: Komunikat dla pustych sekcji
        type: string
      - name: kontakt
        label: Kontakt
        type: object
        fields:
          - name: imie
            label: Imię i nazwisko
            type: string
          - name: rola
            label: Rola / podpis
            type: string
          - name: email
            label: E-mail
            type: string
          - name: telefon
            label: Telefon
            description: Puste = nie wyświetla się.
            type: string
          - name: strona_www
            label: Strona www
            description: Pełny adres z https://. Puste = nie wyświetla się.
            type: string
          - name: lyra_url
            label: Link do Lyra Polska
            type: string
          - name: lyra_nazwa
            label: Tekst linku do Lyry w stopce
            type: string
          - name: lyra_przycisk
            label: Tekst przycisku Lyra
            type: string

  - name: filmy
    label: Biblioteka filmów
    description: Filmy na stronie filmy.html. Wystarczy wkleić link z YouTube.
    type: file
    path: tresci/filmy.json
    format: json
    fields:
      - name: wstep
        label: Wstęp nad listą filmów
        type: text
      - name: filmy
        label: Filmy
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{autor} – {tytul}"
        fields:
          - name: tytul
            label: Tytuł (po polsku)
            type: string
            required: true
          - name: youtube
            label: Link do YouTube
            description: "Np. https://www.youtube.com/watch?v=… lub https://youtu.be/…"
            type: string
            required: true
          - name: autor
            label: Autor / prelegent
            type: string
          - name: wydarzenie
            label: Wydarzenie lub kanał
            description: Np. TED, TEDxWarsaw.
            type: string
          - name: kategoria
            label: Temat
            type: select
            options:
              values:
                - value: wypalenie
                  label: Wypalenie
                - value: energia
                  label: Energia
                - value: odpornosc
                  label: Odporność
                - value: przywodztwo
                  label: Przywództwo i zespół
          - name: opis
            label: Krótki opis
            type: text
          - name: ukryj
            label: Ukryj na stronie
            type: boolean

  - name: ksiazki
    label: Polecane książki
    description: Książki na stronie ksiazki.html.
    type: file
    path: tresci/ksiazki.json
    format: json
    fields:
      - name: wstep
        label: Wstęp nad listą książek
        type: text
      - name: ksiazki
        label: Książki
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{autor} – {tytul}"
        fields:
          - name: id
            label: Identyfikator (do linków z treści)
            description: "Krótka nazwa bez polskich znaków, np. „maslach-prawda”. Link w treści sekcji: ksiazki.html#ksiazka=maslach-prawda. Nie zmieniaj, jeśli jest już użyta w treści."
            type: string
            pattern:
              regex: "^[a-z0-9-]*$"
              message: Tylko małe litery bez polskich znaków, cyfry i myślniki.
          - name: tytul
            label: Tytuł (polskiego wydania, jeśli istnieje)
            type: string
            required: true
          - name: autor
            label: Autor / autorzy
            type: string
            required: true
          - name: tytul_oryginalny
            label: Tytuł oryginalny
            type: string
          - name: wydanie
            label: Wydawnictwo i rok
            type: string
          - name: kategoria
            label: Temat
            type: select
            options:
              values:
                - value: wypalenie
                  label: Wypalenie
                - value: energia
                  label: Energia i stres
                - value: odpornosc
                  label: Odporność
                - value: uwaznosc
                  label: Uważność i zen
                - value: przywodztwo
                  label: Przywództwo i zespół
          - name: zajawka
            label: Krótki opis (widoczny od razu)
            type: text
          - name: tresc
            label: Najważniejsze tezy i dlaczego warto (rozwijane)
            type: rich-text
          - name: link
            label: Link do księgarni
            type: string
          - name: ukryj
            label: Ukryj na stronie
            type: boolean
