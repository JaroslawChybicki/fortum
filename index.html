<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Odporni i gotowi | Lyra Polska</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styl.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./"><img class="znak" src="assets/znak-jasny.png" alt=""><span>Odporni i gotowi</span><img class="lyra" src="logo.png" alt="Lyra Polska"></a>
</div></header>
<svg class="ridge" viewBox="0 0 1200 56" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H1200V18L1080 40 980 22 860 48 760 26 640 44 560 30 430 50 330 24 220 42 120 28 0 44Z" fill="currentColor"/></svg>
<main id="tresc"></main>

<!-- Formularz kontaktowy – wysyłka na e-mail przez Web3Forms (darmowy plan). Klucz access_key jest publiczny z założenia. -->
<section class="wrap" id="napisz" aria-labelledby="napisz-h">
  <form class="kform" name="kontakt" method="POST" action="https://api.web3forms.com/submit">
    <input type="hidden" name="access_key" value="98f4f9e2-3e62-4eaa-b547-511a88c32bb8">
    <input type="hidden" name="subject" value="Nowa wiadomość ze strony „Odporni i gotowi”">
    <input type="hidden" name="from_name" value="Strona Odporni i gotowi">
    <input type="hidden" name="redirect" value="https://fortum.netlify.app/?wyslano=1#napisz">
    <h2 id="napisz-h">Napisz wiadomość</h2>
    <p class="kform-lead">Pytanie o program, sesję coachingową albo materiały? Odpowiem na podany adres e-mail.</p>
    <p class="hp" aria-hidden="true"><label>Nie zaznaczaj tego pola: <input type="checkbox" name="botcheck" tabindex="-1"></label></p>
    <div class="kgrid">
      <label class="kf"><span>Imię</span><input name="imie" autocomplete="given-name" maxlength="80" required></label>
      <label class="kf"><span>E-mail</span><input type="email" name="email" autocomplete="email" maxlength="120" required></label>
      <label class="kf full"><span>Temat</span>
        <select name="temat">
          <option>Pytanie o program „Odporni i gotowi”</option>
          <option>Sesja coachingowa – termin lub organizacja</option>
          <option>Badanie Deep Dive</option>
          <option>Materiały na stronie</option>
          <option>Inne</option>
        </select>
      </label>
      <label class="kf full"><span>Wiadomość</span><textarea name="wiadomosc" rows="6" maxlength="4000" required></textarea></label>
    </div>
    <p class="knote">Nie opisuj w formularzu szczegółów dotyczących zdrowia – na takie rozmowy jest miejsce na sesji.</p>
    <label class="kcheck"><input type="checkbox" name="zgoda" value="tak" required>
      <span>Wyrażam zgodę na przetwarzanie podanych danych (imię, e-mail, treść wiadomości) wyłącznie w celu udzielenia odpowiedzi. Administratorem danych jest prowadzący program; wiadomość jest przekazywana e-mailem za pośrednictwem usługi Web3Forms. Mogę w każdej chwili poprosić o usunięcie danych.</span></label>
    <div class="kactions">
      <button type="submit" class="btn">Wyślij wiadomość</button>
      <span class="kstatus" role="status" aria-live="polite"></span>
    </div>
  </form>
</section>
<footer id="stopka"></footer>
<script src="assets/strona.js"></script>
<script>stronaGlowna();</script>
<script src="assets/kontakt.js"></script>
</body>
</html>
